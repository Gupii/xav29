<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>La Petite Mort</title>
    
    <link rel="stylesheet" href="lapetitemort.css">
</head>
<body>

    <!-- 60/120 FPS GPU Canvas Particle Layer -->
    <canvas id="petalsCanvas"></canvas>
    <div id="lightning"></div>

    <main class="hero-content">
        <h1 class="title" id="actionTitle">LA PETITE MORT</h1>
        <p class="subtitle">An Introduction <br> <span class="slash">/</span> <span class="author-yellow">xavier</span></p>

        <!-- Centered Music Player -->
        <div class="music-player-wrapper">
            <div class="music-player">
                <div class="cd-disc paused" id="cdDisc"></div>
                <div class="track-info">
                    <div class="now-playing-label">Now Playing</div>
                    <div class="track-title">Danny scissorhands</div>
                    <div class="track-artist">Daniel Caesar</div>
                </div>
                <div class="player-controls">
                    <button class="play-pause-btn" id="playPauseBtn" aria-label="Play/Pause">▶</button>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.5" aria-label="Volume">
                </div>
            </div>
        </div>
    </main>

    <script>
        const IMPACT_DELAY_MS = 50; 
        const title = document.getElementById('actionTitle');
        const body = document.body;
        const lightning = document.getElementById('lightning');
        const canvas = document.getElementById('petalsCanvas');
        const ctx = canvas.getContext('2d', { alpha: true });

        const burstSoundURL = "https://res.cloudinary.com/bqio04wg/video/upload/v1788338870/koiroylers-shine-02-355934.mp3";

        // Resize Canvas with DPR Capping to avoid memory spikes
        let width, height;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // High-Performance 2D Canvas Petal System
        const particles = [];
        const isMobile = window.innerWidth <= 768;
        const MAX_AMBIENT = isMobile ? 18 : 35;

        class Petal {
            constructor(isBurst = false, x = 0, y = 0) {
                this.isBurst = isBurst;
                this.x = isBurst ? x : Math.random() * width;
                this.y = isBurst ? y : Math.random() * -height;
                this.size = Math.random() * (isBurst ? 14 : 10) + 8;
                this.aspect = Math.random() * 0.4 + 0.6;
                this.rot = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.04;
                this.opacity = isBurst ? 1 : Math.random() * 0.4 + 0.5;

                if (isBurst) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 8 + 4;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.decay = Math.random() * 0.015 + 0.01;
                    this.color = Math.random() > 0.3 ? '#cc001a' : '#77000d';
                } else {
                    this.vx = Math.random() * 0.8 - 0.4;
                    this.vy = Math.random() * 1.2 + 1.0;
                    this.swaySpeed = Math.random() * 0.02 + 0.01;
                    this.swayOffset = Math.random() * 100;
                    this.color = Math.random() > 0.5 ? '#b80017' : '#5a000a';
                }
            }

            update(step) {
                if (this.isBurst) {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vx *= 0.94; // Drag
                    this.vy *= 0.94;
                    this.opacity -= this.decay;
                    this.rot += this.rotSpeed * 2;
                } else {
                    this.y += this.vy;
                    this.x += Math.sin(step * this.swaySpeed + this.swayOffset) * 0.6;
                    this.rot += this.rotSpeed;

                    if (this.y > height + 20) {
                        this.y = -20;
                        this.x = Math.random() * width;
                    }
                }
            }

            draw() {
                if (this.opacity <= 0) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rot);
                ctx.scale(1, this.aspect);
                ctx.globalAlpha = Math.max(0, this.opacity);
                ctx.fillStyle = this.color;

                // Teardrop Petal Geometry
                ctx.beginPath();
                ctx.moveTo(0, -this.size);
                ctx.quadraticCurveTo(this.size * 0.8, -this.size * 0.5, this.size * 0.5, this.size);
                ctx.quadraticCurveTo(0, this.size * 1.3, -this.size * 0.5, this.size);
                ctx.quadraticCurveTo(-this.size * 0.8, -this.size * 0.5, 0, -this.size);
                ctx.fill();

                ctx.restore();
            }
        }

        // Initialize Ambient Petals
        for (let i = 0; i < MAX_AMBIENT; i++) {
            const p = new Petal(false);
            p.y = Math.random() * height; // Spread across screen initially
            particles.push(p);
        }

        // Dedicated 60/120fps Render Loop
        let tick = 0;
        function renderLoop() {
            ctx.clearRect(0, 0, width, height);
            tick++;

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update(tick);
                p.draw();

                if (p.isBurst && p.opacity <= 0) {
                    particles.splice(i, 1);
                }
            }
            requestAnimationFrame(renderLoop);
        }
        requestAnimationFrame(renderLoop);

        // Climax Trigger
        function triggerBurst(e) {
            if (e) e.stopPropagation();

            const clickAudio = new Audio(burstSoundURL);
            clickAudio.volume = 0.8;
            clickAudio.play().catch(() => {});

            setTimeout(() => {
                title.classList.remove('flare');
                void title.offsetWidth; 
                title.classList.add('flare');
                
                lightning.classList.remove('strike');
                void lightning.offsetWidth;
                lightning.classList.add('strike');

                body.classList.add('flash');
                setTimeout(() => body.classList.remove('flash'), 50);

                const burstCount = isMobile ? 35 : 65;
                const rect = title.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                for (let i = 0; i < burstCount; i++) {
                    particles.push(new Petal(true, centerX, centerY));
                }
            }, IMPACT_DELAY_MS);
        }

        title.addEventListener('click', triggerBurst);

        // Music Player Logic
        const bgMusic = new Audio("https://res.cloudinary.com/bqio04wg/video/upload/v1788339928/audiomass_dannyscissorhands.mp3");
        bgMusic.loop = true;
        bgMusic.volume = 0.5;

        const cdDisc = document.getElementById('cdDisc');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        let isPlaying = false;

        function setPlayState(playing) {
            isPlaying = playing;
            if (isPlaying) {
                bgMusic.play().catch(() => {});
                playPauseBtn.innerText = "⏸";
                cdDisc.classList.remove('paused');
            } else {
                bgMusic.pause();
                playPauseBtn.innerText = "▶";
                cdDisc.classList.add('paused');
            }
        }

        window.addEventListener('load', () => {
            bgMusic.play().then(() => setPlayState(true)).catch(() => {});
        });

        playPauseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            setPlayState(!isPlaying);
        });

        volumeSlider.addEventListener('input', (e) => {
            e.stopPropagation();
            bgMusic.volume = e.target.value;
        });

        document.body.addEventListener('click', function startAudio() {
            if (!isPlaying) setPlayState(true);
            document.body.removeEventListener('click', startAudio);
        }, { once: true });
    </script>
</body>
</html>
