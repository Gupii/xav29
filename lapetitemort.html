<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>La Petite Mort</title>
    
    <link rel="stylesheet" href="lapetitemort.css">
</head>
<body>

    <div id="petal-container"></div>
    <div id="lightning"></div>

    <main class="hero-content">
        <h1 class="title" id="actionTitle">LA PETITE MORT</h1>
        <p class="subtitle">An Introduction</p>

        <!-- Centered Spotify-Style Music Player with Rose Decor -->
        <div class="music-player-wrapper">
            <div class="music-player">
                <div class="cd-disc paused" id="cdDisc"></div>
                <div class="track-info">
                    <div class="now-playing-label">Now Playing</div>
                    <div class="track-title">Danny scissorhands</div>
                    <div class="track-artist">Daniel Caesar</div>
                </div>
                <div class="player-controls">
                    <button class="play-pause-btn" id="playPauseBtn">▶</button>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.5">
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- TUNING VARIABLE FOR EXPLOSION SYNC ---
        const IMPACT_DELAY_MS = 50; 

        const petalContainer = document.getElementById('petal-container');
        const title = document.getElementById('actionTitle');
        const body = document.body;
        const lightning = document.getElementById('lightning');

        const burstSoundURL = "https://res.cloudinary.com/bqio04wg/video/upload/v1788338870/koiroylers-shine-02-355934.mp3";

        // ----------------------------------------------------
        // 1. BACKGROUND MUSIC PLAYER & AUTOPLAY LOGIC
        // ----------------------------------------------------
        const bgMusic = new Audio("https://res.cloudinary.com/bqio04wg/video/upload/v1788339928/audiomass_dannyscissorhands.mp3");
        bgMusic.loop = true;
        bgMusic.volume = 0.5;
        bgMusic.autoplay = true;

        const cdDisc = document.getElementById('cdDisc');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        let isPlaying = false;

        function setPlayState(playing) {
            isPlaying = playing;
            if (isPlaying) {
                bgMusic.play().catch(e => console.log("User interaction required."));
                playPauseBtn.innerText = "⏸";
                cdDisc.classList.remove('paused');
            } else {
                bgMusic.pause();
                playPauseBtn.innerText = "▶";
                cdDisc.classList.add('paused');
            }
        }

        // Try to force autoplay immediately on load
        window.addEventListener('load', () => {
            bgMusic.play().then(() => {
                setPlayState(true);
            }).catch(err => {
                console.log("Browser blocked autoplay. Awaiting first click.");
            });
        });

        playPauseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            setPlayState(!isPlaying);
        });

        volumeSlider.addEventListener('input', (e) => {
            e.stopPropagation();
            bgMusic.volume = e.target.value;
        });

        // Fallback: If autoplay fails, start music on the very first click anywhere
        document.body.addEventListener('click', function startAudio() {
            if (!isPlaying) {
                setPlayState(true);
            }
            document.body.removeEventListener('click', startAudio);
        }, { once: true });


        // ----------------------------------------------------
        // 2. PASSIVE AMBIENT STORM (Petals)
        // ----------------------------------------------------
        function createFallingPetal() {
            const petal = document.createElement('div');
            petal.classList.add('petal', 'petal-fall');

            const size = Math.random() * 22 + 15;
            petal.style.width = `${size}px`;
            petal.style.height = `${size}px`;

            petal.style.left = `${Math.random() * 100}vw`;
            const fallDuration = Math.random() * 8 + 6; 
            petal.style.animationDuration = `${fallDuration}s`;
            petal.style.transform = `rotate(${Math.random() * 360}deg)`;

            if (Math.random() > 0.6) {
                petal.style.background = 'linear-gradient(135deg, #7a0000 0%, #220000 100%)';
                petal.style.zIndex = '1';
                petal.style.filter = 'blur(2px)';
            } else {
                petal.style.zIndex = '15'; 
            }

            petalContainer.appendChild(petal);
            setTimeout(() => petal.remove(), fallDuration * 1000);
        }

        for (let i = 0; i < 25; i++) {
            setTimeout(createFallingPetal, Math.random() * 4000);
        }
        setInterval(createFallingPetal, 450);


        // ----------------------------------------------------
        // 3. THE CLIMAX INTERACTION
        // ----------------------------------------------------
        function triggerBurst(e) {
            e.stopPropagation(); // Prevents double-firing the background play trigger

            const clickAudio = new Audio(burstSoundURL);
            clickAudio.volume = 0.8;
            clickAudio.play().catch(err => console.log("Audio block:", err));

            setTimeout(() => {
                // Trigger Text Flare (Lasts 2.5 seconds per CSS)
                title.classList.remove('flare');
                void title.offsetWidth; 
                title.classList.add('flare');
                
                // Trigger Pink Lightning
                lightning.classList.remove('strike');
                void lightning.offsetWidth;
                lightning.classList.add('strike');

                // Trigger Deep Red Background Flash (Instantly applies, removes class in 50ms, fades over 1.5s per CSS)
                body.classList.add('flash');
                setTimeout(() => body.classList.remove('flash'), 50);

                // Spawn explosive radial petals
                for (let i = 0; i < 80; i++) {
                    const petal = document.createElement('div');
                    petal.classList.add('petal', 'petal-burst');

                    const size = Math.random() * 25 + 10;
                    petal.style.width = `${size}px`;
                    petal.style.height = `${size}px`;

                    const angle = Math.random() * Math.PI * 2;
                    const distance = Math.random() * 80 + 40; 
                    
                    const tx = Math.cos(angle) * distance + 'vw';
                    const ty = Math.sin(angle) * distance + 'vh';
                    const rot = Math.random() * 1000 + 360 + 'deg';

                    petal.style.setProperty('--tx', tx);
                    petal.style.setProperty('--ty', ty);
                    petal.style.setProperty('--rot', rot);

                    const burstDuration = Math.random() * 1.5 + 0.8;
                    petal.style.animationDuration = `${burstDuration}s`;
                    petal.style.zIndex = '20';

                    petalContainer.appendChild(petal);
                    setTimeout(() => petal.remove(), burstDuration * 1000);
                }
            }, IMPACT_DELAY_MS);
        }

        title.addEventListener('click', triggerBurst);
    </script>
</body>
</html>
